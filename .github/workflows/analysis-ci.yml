name: Analysis CI

on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/**"
      - "tests/**"
      - "schemas/**"
      - "docs/**"
      - ".github/workflows/analysis-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install analysis requirements
        run: python -m pip install -r requirements-analysis.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate state
        run: python -m analysis validate-state

      - name: W02 FINAL integration smoke
        shell: bash
        run: |
          set -euo pipefail
          SNAP="data/analysis/weekly_snapshots/W02/FINAL/c2931ef42b944a3e86536742089d0c3f"
          mkdir -p .tmp/analysis-ci
          python -m analysis weekly-report \
            --snapshot "$SNAP" \
            --category "オープン" \
            --region "愛知県" \
            --compare-start 2026-09-23 \
            --compare-end 2026-09-29 \
            --output-json .tmp/analysis-ci/W02-final.json \
            --output-md .tmp/analysis-ci/W02-final.md
          python - <<'PY'
          import json
          report = json.load(open(".tmp/analysis-ci/W02-final.json", encoding="utf-8"))
          assert report["audit"]["status"] != "FAIL", report["audit"]
          assert report["current_week"]["regional"]["selection_basis"] == "venue_prefecture"
          assert report["trend"]["status"] == "available"
          coverage = report["current_week"]["national"]["analysis"]["classification_coverage_top8"]
          ratio = coverage["parent_classified_among_valid_60_lists"]
          assert ratio["denominator"] > 0
          assert ratio["value"] >= 0.90, ratio
          assert report["provenance"]["classifier_market"] == "JP"
          assert report["provenance"]["external_taxonomy_reference"]["rules_imported"] is False
          print(json.dumps({
              "audit": report["audit"]["status"],
              "national_top8": report["current_week"]["national"]["analysis"]["coverage"]["captured_top8_rows"],
              "aichi_top8": report["current_week"]["regional"]["analysis"]["coverage"]["captured_top8_rows"],
              "classified_valid_60": ratio["numerator"],
              "valid_60": ratio["denominator"],
              "classification_coverage": ratio["value"],
              "unclassified": coverage["unclassified_count"],
          }, ensure_ascii=False))
          PY

      - name: Materialize W02 answer index
        shell: bash
        run: |
          set -euo pipefail
          SNAP="data/analysis/weekly_snapshots/W02/FINAL/c2931ef42b944a3e86536742089d0c3f"
          python -m analysis materialize-answer-index \
            --snapshot "$SNAP" \
            --category "オープン" \
            --region "愛知県" \
            --compare-start 2026-09-23 \
            --compare-end 2026-09-29 \
            --output-root .tmp/analysis-ci/answer-index
          python - <<'PY'
          import json
          current = json.load(open(".tmp/analysis-ci/answer-index/current.json", encoding="utf-8"))
          summary = json.load(open(current["summary_path"], encoding="utf-8"))
          decks = json.load(open(current["decks_path"], encoding="utf-8"))
          assert current["week_id"] == "W02"
          assert current["analysis_stage"] == "FINAL"
          assert current["audit_status"] != "FAIL"
          assert summary["snapshot_id"] == current["snapshot_id"]
          expected = summary["current_week"]["national"]["analysis"]["coverage"]["captured_top8_rows"]
          assert decks["row_count"] == expected
          assert decks["row_count"] > 0
          print(json.dumps({
              "generation_id": current["generation_id"],
              "rows": decks["row_count"],
              "audit": current["audit_status"],
          }, ensure_ascii=False))
          PY

      - name: Discover watch-card identity candidates
        shell: bash
        run: |
          set -euo pipefail
          SNAP="data/analysis/weekly_snapshots/W02/FINAL/c2931ef42b944a3e86536742089d0c3f"
          python -m analysis discover-cards \
            --snapshot "$SNAP" \
            --name "シェイミ" \
            --name "ミネズミ" \
            --name "ロケット団のフリーザー" \
            --name "ヒートバーナー" \
            --name "ノココッチex" \
            --name "ドロンチ" \
            --name "バシャーモex" \
            --name "ニャースex" \
            --name "コダック" \
            > .tmp/analysis-ci/watch-card-candidates.json

      - name: Upload analysis diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: analysis-ci-${{ github.run_id }}
          path: .tmp/analysis-ci
          if-no-files-found: warn
          retention-days: 14
