name: Analysis CI

on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/**"
      - "tests/**"
      - "schemas/**"
      - "docs/**"
      - ".github/workflows/analysis-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install analysis requirements
        run: python -m pip install -r requirements-analysis.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate state
        run: python -m analysis validate-state

      - name: W02 FINAL integration smoke
        shell: bash
        run: |
          set -euo pipefail
          SNAP="data/analysis/weekly_snapshots/W02/FINAL/c2931ef42b944a3e86536742089d0c3f"
          mkdir -p .tmp/analysis-ci
          python -m analysis weekly-report \
            --snapshot "$SNAP" \
            --category "オープン" \
            --region "愛知県" \
            --compare-start 2026-09-23 \
            --compare-end 2026-09-29 \
            --output-json .tmp/analysis-ci/W02-final.json \
            --output-md .tmp/analysis-ci/W02-final.md
          python - <<'PY'
          import json
          report = json.load(open(".tmp/analysis-ci/W02-final.json", encoding="utf-8"))
          assert report["audit"]["status"] != "FAIL", report["audit"]
          assert report["current_week"]["regional"]["selection_basis"] == "venue_prefecture"
          assert report["trend"]["status"] == "available"
          print(json.dumps({
              "audit": report["audit"]["status"],
              "national_top8": report["current_week"]["national"]["analysis"]["coverage"]["captured_top8_rows"],
              "aichi_top8": report["current_week"]["regional"]["analysis"]["coverage"]["captured_top8_rows"],
              "unclassified": report["current_week"]["national"]["analysis"]["classification_coverage_top8"]["unclassified_count"],
          }, ensure_ascii=False))
          PY

      - name: Discover watch-card identity candidates
        shell: bash
        run: |
          set -euo pipefail
          SNAP="data/analysis/weekly_snapshots/W02/FINAL/c2931ef42b944a3e86536742089d0c3f"
          python -m analysis discover-cards \
            --snapshot "$SNAP" \
            --name "シェイミ" \
            --name "ミネズミ" \
            --name "ロケット団のフリーザー" \
            --name "ヒートバーナー" \
            --name "ノココッチex" \
            --name "ドロンチ" \
            --name "バシャーモex" \
            --name "ニャースex" \
            --name "コダック" \
            > .tmp/analysis-ci/watch-card-candidates.json

      - name: Discover unclassified archetype candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from analysis.cards import section_type, validate_deck
          from analysis.classification import classify

          snap = Path("data/analysis/weekly_snapshots/W02/FINAL/c2931ef42b944a3e86536742089d0c3f")
          metadata = json.load(open(snap / "metadata.json", encoding="utf-8"))
          city = json.load(open(snap / "inputs/data/city_db.json", encoding="utf-8"))
          decks = json.load(open(snap / "inputs/data/city_decks.json", encoding="utf-8"))["decks"]
          allowed = set(metadata["event_ids"])
          identities = {}
          deck_rows = []
          unknown = 0
          invalid = 0
          for event in city["events"]:
              if event.get("event_id") not in allowed or event.get("category") != "オープン":
                  continue
              for placement in event.get("placements", []):
                  rank = placement.get("rank")
                  if type(rank) is not int or rank > 8:
                      continue
                  code = placement.get("deck_code")
                  deck = decks.get(code)
                  if not deck or any(x["severity"] == "ERROR" for x in validate_deck(deck)):
                      invalid += 1
                      continue
                  result = classify(code, deck, "2026-10-07T00:00:00+00:00")
                  if result["parent_archetype"] is not None:
                      continue
                  unknown += 1
                  pokemon = []
                  for card in deck["cards"]:
                      if section_type(card.get("section")) != "pokemon":
                          continue
                      key = (card.get("card_id"), card.get("name"))
                      pokemon.append({
                          "card_id": key[0], "name": key[1], "count": card["count"],
                      })
                      entry = identities.setdefault(key, {
                          "card_id": key[0], "name": key[1],
                          "adopting_lists": 0, "total_copies": 0,
                      })
                      entry["adopting_lists"] += 1
                      entry["total_copies"] += card["count"]
                  pokemon.sort(key=lambda x: (-x["count"], x["name"] or "", x["card_id"] or ""))
                  deck_rows.append({
                      "event_id": event["event_id"], "rank": rank,
                      "deck_code": code, "pokemon": pokemon,
                  })
          identity_rows = sorted(
              ({**v, "average_copies": v["total_copies"] / v["adopting_lists"]}
               for v in identities.values()),
              key=lambda x: (-x["adopting_lists"], -x["average_copies"], x["name"] or ""),
          )
          out = {
              "unknown_valid_decks": unknown,
              "invalid_or_missing": invalid,
              "top_pokemon_identities": identity_rows[:200],
              "decks": deck_rows,
          }
          Path(".tmp/analysis-ci/archetype-candidates.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "unknown_valid_decks": unknown,
              "invalid_or_missing": invalid,
              "candidate_identity_count": len(identity_rows),
          }, ensure_ascii=False))
          PY

      - name: Upload analysis diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: analysis-ci-${{ github.run_id }}
          path: .tmp/analysis-ci
          if-no-files-found: warn
          retention-days: 14
