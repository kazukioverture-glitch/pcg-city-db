name: W03 Dragapult Fire variant check
on:
  push:
    paths:
      - ".github/workflows/oneoff-fire-identity.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Analyze Dragapult only on W03 complete Top16 events
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict,Counter
          from pathlib import Path
          from analysis.classification import classify,VERSION
          city=json.loads(Path("data/city_db.json").read_text(encoding="utf-8"))
          db=json.loads(Path("data/city_decks.json").read_text(encoding="utf-8"))["decks"]
          events=[e for e in city["events"] if e.get("category")=="オープン" and "2026-10-07"<=e.get("date","")<="2026-10-10"
                  and int(e.get("top16_observed_rows") or 0)>=8
                  and sum(8<int(p["rank"])<=16 for p in e["placements"])==int(e.get("top16_observed_rows") or 0)]
          assert len(events)==32,len(events)
          group=defaultdict(lambda:Counter())
          copies=Counter()
          reviewed=Counter()
          for e in events:
              for p in e["placements"]:
                  rank=int(p["rank"])
                  if not 1<=rank<=16:continue
                  code=p["deck_code"]
                  result=classify(code,db[code],"2026-10-10T00:00:00Z")
                  if result.get("parent_archetype")!="ドラパルトex" or result.get("classification_status")!="classified":
                      continue
                  tags=frozenset(result.get("variant_tags") or [])
                  if tags=={"ノココッチ型","ヨノワール型"}: variant="両採用"
                  elif "ヨノワール型" in tags: variant="ヨノワール型"
                  elif "ノココッチ型" in tags: variant="ノココッチ型"
                  elif not tags:variant="両方なし"
                  else:variant="その他タグ"
                  n=sum(int(c["count"]) for c in db[code]["cards"] if str(c.get("card_id"))=="48354" and c.get("name") in ("ファイヤー","ファイヤーM2014/080"))
                  s=group[variant]
                  s["all"]+=1
                  s["all_top8"]+=int(rank<=8)
                  s["all_champion"]+=int(rank==1)
                  key="fire" if n else "no_fire"
                  s[key]+=1
                  s[key+"_top8"]+=int(rank<=8)
                  s[key+"_champion"]+=int(rank==1)
                  if n:copies[n]+=1
                  reviewed[variant]+=1
          assert sum(s["all"] for s in group.values())==148
          assert sum(s["fire"] for s in group.values())==79
          assert sum(copies.values())==79
          print("W03 DRAGAPULT VARIANTS:"+json.dumps({"source_updated_at":city.get("updated_at"),
             "classifier_version":VERSION,"matched_events":len(events),
             "fire_copies_in_79_lists":dict(copies),"groups":{k:dict(v) for k,v in sorted(group.items())}},ensure_ascii=False))
          PY
