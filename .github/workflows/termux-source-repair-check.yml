name: Validate Termux Source Repair

on:
  push:
    branches: [main, fix/termux-source-freshness-20261012]
    paths:
      - "scripts/termux_refresh.sh"
      - "collector/sync.py"
      - "tests/test_termux_source_freshness.py"
      - ".github/workflows/termux-source-repair-check.yml"
  pull_request:
    paths:
      - "scripts/termux_refresh.sh"
      - "collector/sync.py"
      - "tests/test_termux_source_freshness.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check Termux shell syntax
        run: bash -n scripts/termux_refresh.sh
      - name: Install collector dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Test source freshness and Top16 invariants
        run: |
          python -m unittest discover -s tests -p 'test_termux_source_freshness.py' -v
          python -m unittest discover -s tests -p 'test_top16_collection.py' -v
