name: Sync City League DB

on:
  workflow_dispatch:
  schedule:
    - cron: "10,40 0-14,23 * * *"

permissions:
  contents: write

concurrency:
  group: city-db-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Termux DB
        run: |
          set -euo pipefail
          mkdir -p .tmp data

          download_json() {
            local name="$1"
            local url="$2"
            local output="$3"

            echo "Downloading $name from $url"
            curl --fail --silent --show-error --location \
              --retry 3 \
              --retry-connrefused \
              --connect-timeout 15 \
              --max-time 120 \
              --write-out "\nHTTP status: %{http_code}\n" \
              -H "ngrok-skip-browser-warning: true" \
              "$url" \
              -o "$output"
          }

          city_status=0
          decks_status=0

          download_json "city-db.json" \
            "https://tuition-occultist-unwritten.ngrok-free.dev/city-db.json" \
            ".tmp/city_db.json" || city_status=$?

          download_json "city-decks.json" \
            "https://tuition-occultist-unwritten.ngrok-free.dev/city-decks.json" \
            ".tmp/city_decks.json" || decks_status=$?

          if [ "$city_status" -ne 0 ] || [ "$decks_status" -ne 0 ]; then
            echo "::error::Download failed (city-db curl=$city_status, city-decks curl=$decks_status)."
            exit 1
          fi

      - name: Validate and update
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          tmp_city = Path(".tmp/city_db.json")
          tmp_decks = Path(".tmp/city_decks.json")

          out_city = Path("data/city_db.json")
          out_decks = Path("data/city_decks.json")
          out_index = Path("data/index.json")

          with tmp_city.open(encoding="utf-8") as f:
              city = json.load(f)

          with tmp_decks.open(encoding="utf-8") as f:
              decks = json.load(f)

          if not isinstance(city, dict):
              raise SystemExit
