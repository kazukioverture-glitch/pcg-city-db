name: Sync City League DB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
      - "collector/**"
  schedule:
    # JST 18:00, 20:00, 22:00, 23:00 (event day), 08:00 (next morning).
    # GitHub Actions cron is UTC; early-morning JST run is 23:00 UTC on the previous day.
    - cron: "0 9,11,13,14,23 * * *"

permissions:
  contents: write

concurrency:
  group: city-db-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      TERMUX_BASE_URL: https://forwarding-compaq-spam-cape.trycloudflare.com # temporary recovery; quick tunnel URL rotates on restart
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install state tooling
        run: python -m pip install -r requirements-analysis.txt

      - name: Acquire, validate and stage DB transaction
        run: python -m collector.sync

      - name: Commit only when changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/city_db.json data/city_decks.json data/index.json data/analysis/event_ledger.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync city league DB'
            git push
          fi

      - name: Retain collection diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-diagnostics-${{ github.run_id }}
          path: |
            .tmp/sync/sync_report.json
            .tmp/sync/termux/download_report.json
            .tmp/sync/official/official_audit.json
          if-no-files-found: ignore
          retention-days: 14
