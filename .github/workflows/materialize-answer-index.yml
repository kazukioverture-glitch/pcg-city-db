name: Materialize FINAL answer index

on:
  push:
    branches:
      - main
    paths:
      - "data/analysis/weekly_snapshots/**/FINAL/**"

permissions:
  contents: write

concurrency:
  group: materialize-final-answer-index
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward to latest main
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Install analysis requirements
        run: python -m pip install -r requirements-analysis.txt

      - name: Materialize newest FINAL answer index
        shell: bash
        run: |
          set -euo pipefail
          python -m analysis materialize-latest-answer-index             --category "オープン"             --region "愛知県"             --output-root data/analysis/answer_index

      - name: Commit answer index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/answer_index
          if git diff --cached --quiet; then
            echo "No answer index changes"
            exit 0
          fi
          git commit -m "Refresh FINAL answer index"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
