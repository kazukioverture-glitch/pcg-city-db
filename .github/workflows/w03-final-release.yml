name: W03 captured-results FINAL release

on:
  push:
    branches:
      - work/w03-final-20261017
    paths:
      - analysis/release_w03.py
      - .github/workflows/w03-final-release.yml

permissions:
  contents: write

concurrency:
  group: city-db-sync
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install analysis requirements
        run: python -m pip install -r requirements-analysis.txt
      - name: Run pre-release regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m analysis validate-state
      - name: Create immutable W03 FINAL from validated Git input
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m analysis.release_w03
          git push origin HEAD:work/w03-final-20261017
      - name: Show final status
        run: |
          echo 'W03 scoped FINAL committed and pushed to work branch.' >> "$GITHUB_STEP_SUMMARY"
          git log -1 --oneline >> "$GITHUB_STEP_SUMMARY"
